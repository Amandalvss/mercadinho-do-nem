<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Venda</title>
    <style>
        body { background-color: #0A192F; color: white; font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #00B4D8; }
        input, select { width: 100%; padding: 12px; border-radius: 5px; border: none; font-size: 16px; }
        .btn { background-color: #00B4D8; color: #0A192F; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 20px;}
        .btn-voltar { background-color: #333; color: white; text-decoration: none; display: block; text-align: center; padding: 15px; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Nova Venda</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Produto:</label>
            <select name="produto" required>
                <option value="">Selecione...</option>
                {% for produto in produtos %}
                    <option value="{{ produto.id }}">{{ produto.nome }} - R$ {{ produto.preco_venda }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Quantidade:</label>
            <input type="number" name="quantidade" value="1" min="1" required>
        </div>

        <div class="form-group">
            <label>Forma de Pagamento:</label>
            <select name="forma_pagamento" required>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Cartão">Cartão</option>
                <option value="Fiado">Fiado</option>
            </select>
        </div>

        <div class="form-group">
            <label>Cliente (Obrigatório se for Fiado):</label>
            <select name="cliente">
                <option value="">Nenhum (Venda normal)</option>
                {% for cliente in clientes %}
                    <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn">Confirmar Venda</button>
        <a href="{% url 'menu' %}" class="btn-voltar">Voltar ao Menu</a>
    </form>
</body>
</html>
